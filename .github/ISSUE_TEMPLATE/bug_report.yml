name: Bug report
description: Report a reproducible problem with code, docs, or tooling.
title: "[Bug]: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and exact input
      description: Include the command, input, Python version, and operating system.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include output or an error message. Do not include secrets.
    validations:
      required: true
